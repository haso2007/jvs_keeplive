services:
  modelscope-keep-alive:
    image: jvs_keeplive-modelscope-keep-alive
    container_name: modelscope-keep-alive
    restart: unless-stopped
    init: true
    # Hard ceiling so the browser can't grow unbounded (the target page is heavy).
    mem_limit: 1.5g
    # Cap total CPU to one core. Lower it (e.g. 0.5) if the NAS is still busy.
    cpus: 1.0
    shm_size: "256mb"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MODELSCOPE_STATE_DIR: /data
      TZ: Asia/Shanghai
      # Recycle Chromium when its total RSS exceeds this many MB (before mem_limit).
      MODELSCOPE_RECYCLE_MEMORY_MB: "900"
    volumes:
      - ./nas-data:/data
      - ./modelscope_keep_alive.py:/app/modelscope_keep_alive.py:ro
    command:
      - python
      - modelscope_keep_alive.py
      - --browser-channel
      - chromium
      - --check-interval
      - "300"
      - --browser-recycle-seconds
      - "3600"
