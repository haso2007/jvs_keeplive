services:
  modelscope-keep-alive:
    image: jvs_keeplive-modelscope-keep-alive
    container_name: modelscope-keep-alive
    restart: unless-stopped
    init: true
    # Hard ceiling only; the script recycles at 1200MB so Chromium restarts
    # before the 2g cgroup limit, with headroom for NAS memory accounting.
    mem_limit: 2g
    shm_size: "512m"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MODELSCOPE_STATE_DIR: /data
      TZ: Asia/Shanghai
      MODELSCOPE_RECYCLE_MEMORY_MB: "1200"
    volumes:
      - ./nas-data:/data
      - ./modelscope_keep_alive.py:/app/modelscope_keep_alive.py:ro
    command:
      - python
      - modelscope_keep_alive.py
      - --browser-channel
      - chromium
      - --check-interval
      - "17500"
      - --browser-recycle-seconds
      - "43200"
