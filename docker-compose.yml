services:
  modelscope-keep-alive:
    image: jvs_keeplive-modelscope-keep-alive
    container_name: modelscope-keep-alive
    restart: unless-stopped
    init: true
    # Hard ceiling only; the script recycles at 900MB so steady state stays under 1GB.
    mem_limit: 1.5g
    cpus: 1.0
    shm_size: "512m"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MODELSCOPE_STATE_DIR: /data
      TZ: Asia/Shanghai
      MODELSCOPE_RECYCLE_MEMORY_MB: "900"
    volumes:
      - ./nas-data:/data
      - ./modelscope_keep_alive.py:/app/modelscope_keep_alive.py:ro
    command:
      - python
      - modelscope_keep_alive.py
      - --browser-channel
      - chromium
      - --check-interval
      - "17500"
      - --browser-recycle-seconds
      - "43200"
